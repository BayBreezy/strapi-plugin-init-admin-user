<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">Init Admin User logo: an ignition key whose bow holds an admin avatar</title>
  <defs>
    <clipPath id="avatar-clip">
      <circle cx="176" cy="256" r="64" />
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="116" fill="#0E4B5A" />

  <!-- the turn: a clockwise sweep around the key's bow, like starting an engine -->
  <path d="M114.6 314.7A142 142 0 0 1 174.8 90" fill="none" stroke="#F1DDB0" stroke-width="20" stroke-linecap="round" />
  <path d="M199.2 81.1 164.8 74.5 177.2 108.3z" fill="#F1DDB0" stroke="#F1DDB0" stroke-width="6" stroke-linejoin="round" />

  <g transform="translate(24 24) rotate(45 256 256)" fill="#7FD9C0">
    <!-- bow -->
    <circle cx="176" cy="256" r="91" fill="none" stroke="#7FD9C0" stroke-width="26" />
    <!-- admin avatar, kept upright -->
    <g clip-path="url(#avatar-clip)">
      <g transform="rotate(-45 176 256)">
        <circle cx="176" cy="232" r="25" />
        <path d="M124 320c0-34 23.3-56 52-56s52 22 52 56v40H124z" />
      </g>
    </g>
    <!-- collar, shaft and teeth -->
    <rect x="288" y="218" width="18" height="76" rx="7" />
    <path d="M262 238h186a10 10 0 0 1 10 10v16a10 10 0 0 1-10 10h-4v40a8 8 0 0 1-8 8h-14a8 8 0 0 1-8-8v-40h-18v28a8 8 0 0 1-8 8h-14a8 8 0 0 1-8-8v-28H262z" />
  </g>
</svg>
